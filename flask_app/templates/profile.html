<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Профиль</title>
    <style>
        body {
            font-family: 'Verdana', sans-serif;
            background: #1e1e2f;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e0e0e0;
        }

        .container {
            background: #2b2b3d;
            padding: 30px 25px;
            border-radius: 12px;
            width: 400px;
            box-shadow: 0 0 25px rgba(0,0,0,0.3);
            text-align: center;
        }

        h2 {
            font-size: 26px;
            margin-bottom: 20px;
            color: #ffdd57;
        }

        p {
            font-size: 15px;
            margin-bottom: 25px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            transition: 0.2s;
        }

        .btn-shop {
            background: #ff8c42;
            color: #1e1e2f;
        }

        .btn-shop:hover {
            background: #ffa85c;
        }

        .btn-logout {
            background: #ff4c4c;
            color: #1e1e2f;
        }

        .btn-logout:hover {
            background: #ff6b6b;
        }

        .error {
            background: #ff4c4c33;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            text-align: center;
            font-weight: bold;
            color: #ff4c4c;
        }
    </style>
</head>
<body>

    <div class="container">
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <h2>Профиль: {{ username }}</h2>
        <p>О тебе: {{ bio }}</p>

        <a href="{{ url_for('products') }}">
            <button class="btn btn-shop">В магазин</button>
        </a>
        <a href="{{ url_for('logout') }}">
            <button class="btn btn-logout">Выйти</button>
        </a>
    </div>

</body>
</html>
