<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <style>
        body {
            font-family: 'Verdana', sans-serif;
            background: #1e1e2f;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e0e0e0;
        }

        .container {
            background: #2b2b3d;
            padding: 30px 25px;
            border-radius: 12px;
            width: 360px;
            box-shadow: 0 0 25px rgba(0,0,0,0.3);
        }

        h2 {
            text-align: center;
            font-size: 26px;
            margin-bottom: 25px;
            color: #ffdd57;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border-radius: 8px;
            border: 1px solid #555;
            background: #1e1e2f;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #ff8c42;
            border: none;
            border-radius: 8px;
            color: #1e1e2f;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background: #ffa85c;
        }

        .links {
            margin-top: 15px;
            text-align: center;
        }

        .links a {
            color: #ff8c42;
            text-decoration: none;
            font-size: 13px;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .error {
            background: #ff4c4c33;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            text-align: center;
            font-weight: bold;
            color: #ff4c4c;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Создать аккаунт</h2>

        <form method="POST">
            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}

            <input type="text" name="username" placeholder="Имя пользователя" required>
            <input type="password" name="password" placeholder="Пароль" required>
            <textarea name="bio" placeholder="Расскажите немного о себе"></textarea>

            <button class="btn">Регистрация</button>
        </form>

        <div class="links">
            <a href="{{ url_for('login') }}">Уже есть аккаунт? Войти</a>
        </div>
    </div>

</body>
</html>
