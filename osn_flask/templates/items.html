<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список элементов</title>
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-top: 40px;
            font-size: 32px;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
            text-align: center;
        }

        .items-list {
            width: 90%;
            max-width: 700px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .title {
            font-size: 18px;
            font-weight: 700;
            color: #ffd700;
            margin-bottom: 10px;
        }

        .desc {
            font-size: 14px;
            color: #e0e0e0;
            line-height: 1.4;
        }

        .links {
            margin-bottom: 40px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .links a {
            text-decoration: none;
            color: #ffd700;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 12px;
            transition: background 0.3s ease, transform 0.3s ease;
        }

        .links a:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        p {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Список элементов</h1>

    {% if items %}
        <div class="items-list">
            {% for x in items %}
                <div class="card">
                    <div class="title">{{ x.title.capitalize() }}</div>
                    <div class="desc">{{ x.desc.capitalize() }}</div>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <p>Список пуст.</p>
    {% endif %}

    <div class="links">
        <a href="{{ url_for('index') }}">Главная</a>
        <a href="{{ url_for('search') }}">Поиск</a>
    </div>
</body>
</html>
