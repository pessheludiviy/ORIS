<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>О проекте</title>
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-top: 40px;
            font-size: 28px;
            text-align: center;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
        }

        h2 {
            text-align: center;
            margin-top: 20px;
            font-weight: 500;
            color: #ffd700;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: 900px;
            margin: 40px 0;
        }

        .item {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
        }

        .item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            margin: 0 auto 15px auto;
            background: #ffd700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .content-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .content-subtitle {
            font-size: 13px;
            color: #e0e0e0;
        }

        nav {
            margin-bottom: 50px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        nav a {
            color: #ffd700;
            text-decoration: none;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            transition: background 0.3s ease, transform 0.3s ease;
        }

        nav a:hover {
            background: rgba(255,255,255,0.25);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <h1>Flask🤔🤔🤔</h1>
    <h1 style="color: #ffd700">Возможности</h1>
    <div class="grid">
        <div class="item">
            <div class="content-title">Профили пользователей</div>
            <div class="content-subtitle">невероятные персонализированные страницы</div>
        </div>
        <div class="item">
            <div class="content-title">Каталог предметов</div>
            <div class="content-subtitle">неимоверно удобный просмотр данных</div>
        </div>
        <div class="item">
            <div class="content-title">Поиск</div>
            <div class="content-subtitle">мгновенный переход между страницами, даже таких, каких не существует😱😱😱</div>
        </div>
    </div>

    <nav>
        <a href="{{ url_for('index') }}">Главная</a>
        <a href="{{ url_for('items') }}">Каталог</a>
        <a href="{{ url_for('search') }}">Поиск</a>
    </nav>
</body>
</html>
