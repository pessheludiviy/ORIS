<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Поиск пользователя</title>
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
        }

        .search-form {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }

        input {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            border: none;
            outline: none;
        }

        button {
            background-color: #ffd700;
            color: #1f1c2c;
            font-weight: 600;
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .links {
            margin-top: 30px;
            display: flex;
            gap: 20px;
        }

        .links a {
            color: #ffd700;
            text-decoration: none;
            font-weight: 600;
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 12px;
            transition: background 0.3s ease, transform 0.3s ease;
        }

        .links a:hover {
            background: rgba(255,255,255,0.25);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <h1>Поиск пользователя</h1>
    <form method="GET" class="search-form">
        <input type="text" name="username" placeholder="Введите имя пользователя" required>
        <button>Найти</button>
    </form>
    <div class="links">
        <a href="{{ url_for('index') }}">Главная</a>
        <a href="{{ url_for('items') }}">Каталог</a>
    </div>
</body>
</html>
